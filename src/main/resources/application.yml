spring:
  datasource:
    url: jdbc:mysql://localhost:3306/B2B_food-manage
    username: root
    password: 1234
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  data:
    redis:
      host: localhost
      port: 6379
      database: 0

  cache:
    type: redis
    redis:
      time-to-live: 30m
      cache-null-values: false
      use-key-prefix: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
    # 不再直接往控制台裸打SQL，统一交给slf4j -> logback管理
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

pagehelper:
  helperDialect: mysql
  reasonable: true
  supportMethodsArguments: true
  params: count=countSql

logging:
  level:
    root: INFO
    com.group8: INFO
    # 缓存命中/回源调试时可临时打开
    org.springframework.cache: DEBUG
    org.springframework.data.redis.cache: DEBUG
    # 事务日志可保留 debug，排查事务问题有帮助
    org.springframework.jdbc.support.JdbcTransactionManager: DEBUG
    # MyBatis SQL 若想看细节可开 DEBUG（平时建议 INFO/WARN）
    org.mybatis: INFO

aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: rolsun-java
    region: cn-beijing
    accessKeyId: ${ALIYUN_OSS_ACCESS_KEY_ID:your-key-id}
    accessKeySecret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:your-key-secret}
    url-prefix: https://rolsun-java.oss-cn-beijing.aliyuncs.com

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: "default"
      paths-to-match: "/**"
      packages-to-scan: com.group8.controller
