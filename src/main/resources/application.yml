#配置数据库的连接信息
spring:
    datasource:
      url: jdbc:mysql://localhost:3306/B2B_food-manage
      username: root
      password: 1234
      driver-class-name: com.mysql.cj.jdbc.Driver

    servlet:
      multipart:
        max-file-size: 10MB
        max-request-size: 100MB


#Mybatis配置
      mybatis:
        mapper-locations: classpath:mapper/*.xml
        configuration:
          map-underscore-to-camel-case: true
          log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

#开启驼峰映射
mybatis:
  configuration:
    map-underscore-to-camel-case: true

#配置pagehelper
    pagehelper:
      helperDialect: mysql
      reasonable: true
      supportMethodsArguments: true
      params: count=countSql

#配置日志
logging:
    level:
        org.springframework.jdbc.support.JdbcTransactionManager: debug



#阿里云OSS
aliyun:
  oss:
    endpoint: https://oss-cn-beijing.aliyuncs.com
    bucketName: rolsun-java
    region: cn-beijing

# Redis 配置
  redis:
    host: localhost
    port: 6379
    database: 0

# Swagger 配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.group8.controller
